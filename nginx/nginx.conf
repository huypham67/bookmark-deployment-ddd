user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Edge rate limiting by client IP: coarse anti-flood protection that shields the backends before requests reach them.
    # Precise per-user limits are enforced in each app via Redis, since Nginx cannot read the user from the JWT.
    limit_req_zone $binary_remote_addr zone=api_edge:10m rate=10r/s;
    limit_req_status 429;

    upstream user_backend {
        server user-service:8080;
    }

    upstream bookmark_backend {
        server bookmark-service:8080;
    }

    upstream portal_frontend {
        server bookmark-portal:3000;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── user-service ──────────────────────────────────────────────
        location /api/user_service/swagger/ {
            proxy_pass http://user_backend/swagger/;
        }

        location /api/user_service/ {
            limit_req zone=api_edge burst=20 nodelay;
            proxy_pass http://user_backend/api/user_service/;
        }

        # ── bookmark-service ──────────────────────────────────────────
        location /api/bookmark_service/swagger/ {
            proxy_pass http://bookmark_backend/swagger/;
        }

        location /api/bookmark_service/ {
            limit_req zone=api_edge burst=20 nodelay;
            proxy_pass http://bookmark_backend/api/bookmark_service/;
        }

        # Block dotfiles
        location ~ /\. {
            deny all;
        }

        # ── portal (frontend) ─────────────────────────────────────────
        location / {
            proxy_pass http://portal_frontend;
        }
    }
}
